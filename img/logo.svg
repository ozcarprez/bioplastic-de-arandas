<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 332" width="320" height="332"
     role="img" aria-label="Bioplastic de Arandas" style="color:#1b5e20">
  <title>Bioplastic de Arandas</title>

  <defs>
    <!-- hoja con nervadura calada (se ve el fondo a traves) -->
    <path id="bpa-hoja-g" fill-rule="evenodd"
          d="M100 98c-20-16-20-52 0-74 20 22 20 58 0 74z M100 87c-6-11-6-33 0-46 6 13 6 35 0 46z"/>
    <path id="bpa-hoja-c" fill-rule="evenodd"
          d="M100 98c-16-12-16-38 0-54 16 16 16 42 0 54z M100 89c-5-8-5-24 0-32 5 8 5 24 0 32z"/>
    <clipPath id="bpa-globo">
      <circle cx="100" cy="150" r="30"/>
    </clipPath>
  </defs>

  <g transform="translate(60,-12)">
    <!-- hojas -->
    <g fill="currentColor">
      <use href="#bpa-hoja-c" transform="rotate(-60 100 98)"/>
      <use href="#bpa-hoja-c" transform="rotate(60 100 98)"/>
      <use href="#bpa-hoja-g" transform="rotate(-22 100 98)"/>
      <use href="#bpa-hoja-g" transform="rotate(22 100 98)"/>
    </g>

    <!-- borde del vaso -->
    <rect x="32" y="98" width="136" height="22" rx="11" fill="currentColor"/>

    <!-- cuerpo del vaso -->
    <path d="M44 124l17 56a12 12 0 0 0 11 8h56a12 12 0 0 0 11-8l17-56"
          fill="none" stroke="currentColor" stroke-width="9"
          stroke-linecap="round" stroke-linejoin="round"/>

    <!-- globo -->
    <circle cx="100" cy="150" r="30" fill="none" stroke="currentColor" stroke-width="6"/>
    <g clip-path="url(#bpa-globo)" fill="currentColor">
      <path d="M82 122c9-2 14 4 12 10-2 6-8 8-8 13 0 7 7 9 3 16-3 6-10 5-15 0-6-8-8-19-5-28 2-7 7-10 13-11z"/>
      <path d="M116 131c9 1 13 8 10 15-3 6-10 7-11 13-2 8-9 12-14 6-6-7-3-18 2-26 4-5 8-8 13-8z"/>
      <path d="M91 170c7-2 14 1 14 7 0 5-5 9-11 9-7 0-11-5-10-10 1-3 3-5 7-6z"/>
    </g>
  </g>

  <!-- BIOPLASTIC -->
  <text x="160" y="253" text-anchor="middle" textLength="286" lengthAdjust="spacingAndGlyphs"
        fill="currentColor" font-family="Outfit, 'Trebuchet MS', 'Segoe UI', Verdana, sans-serif"
        font-size="48" font-weight="800" letter-spacing="1">BIOPLASTIC</text>

  <!-- DE ARANDAS -->
  <rect x="96" y="268" width="128" height="38" rx="19" fill="currentColor"/>
  <text x="160" y="294" text-anchor="middle" textLength="100" lengthAdjust="spacingAndGlyphs"
        fill="#ffffff" font-family="Outfit, 'Trebuchet MS', 'Segoe UI', Verdana, sans-serif"
        font-size="20" font-weight="700" letter-spacing="2">DE ARANDAS</text>
</svg>
